# The live game server for Vocab Live, Blast and Match.
# Cloudflare builds and deploys this folder as its own Worker, "vocab-live".
# If you name the Worker something else, change `name` below to match.
# It has no web address of its own: your Pages site
# reaches it through a Durable Object binding called LIVE.
# Setup steps are in the kit's README.md, steps 4 and 5.
name = "vocab-live"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveGame"

# The class leaderboard (src/board.js): the roster, Class Pass sign-ins and
# results. One Durable Object for the whole site. The Pages site reaches it
# through LIVE (a LiveGame passes its requests on), so nothing more needs
# setting up on the Pages project.
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Leaderboard"

# SQLite storage is the kind the free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveGame"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard"]

# Workers AI double checks typed nicknames (src/names.js). Free daily use is
# plenty for a class; if it runs out, names are checked by the word lists only.
[ai]
binding = "AI"

# The nightly link check (src/links.js): every day at 10:23 UTC (2:23 a.m.
# Pacific in winter, 3:23 in summer) a few of the physical science site's
# videos and web links are checked. Workers & Pages > vocab-live > Settings >
# Trigger events shows it. Two optional secrets (Settings > Variables and
# Secrets, type Secret) make it do more:
#   BRAVE_KEY      a Brave Search API key: replacements for broken links
#   CF_API_TOKEN   a Cloudflare API token with Account Analytics: Read, for
#                  the Site check page's count of today's Workers AI use
[triggers]
crons = ["23 10 * * *"]
